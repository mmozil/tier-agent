server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html NUNCA em cache no browser → todo deploy aparece na hora.
  # (os assets hasheados continuam "immutable" abaixo). Resolve o "deploy nao
  # entra" causado por cache heuristico do HTML sem Cache-Control.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # API calls vão direto pra api-agent.tier.finance via CORS
  # (frontend usa axios baseURL absoluta — ver src/lib/api.ts)

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  # Cache estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
