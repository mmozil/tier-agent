# Dev local — Postgres + Redis + backend
# Uso:  cd infra && docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:15
    container_name: tier-agent-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tier_agent
    ports:
      - "5532:5432"
    volumes:
      - tier-agent-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tier-agent-redis-dev
    restart: unless-stopped
    ports:
      - "6479:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tier-agent-backend-dev
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8100:8100"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tier_agent
      REDIS_URL: redis://redis:6379/3

volumes:
  tier-agent-pg-data:
